<!DOCTYPE html>
<html>
<head>
  <title>Hidden Vote</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
    button { font-size: 18px; margin: 10px; padding: 10px 20px; }
    #hiddenBox { display:none; margin-top:30px; }
  </style>
</head>
<body>

<h2>Planning Vote (Hidden)</h2>

<button onclick="vote('A')">Vote A</button>
<button onclick="vote('B')">Vote B</button>

<p id="status"></p>

<div id="hiddenBox">
  <h3>Hidden Result</h3>
  <p id="hiddenText"></p>
</div>

<br>
<button onclick="reveal()">Reveal (Owner Only)</button>

<script>
const PASSWORD = "1234"; // 🔑 change this to your own password

function vote(v) {
  document.getElementById("status").innerText = "You voted: " + v;

  let hidden = "";
  if (v === "A") hidden = "A = Small task";
  if (v === "B") hidden = "B = Large task";

  document.getElementById("hiddenText").innerText = hidden;
}

function reveal() {
  let input = prompt("Enter owner password:");

  if (input === PASSWORD) {
    document.getElementById("hiddenBox").style.display = "block";
  } else {
    alert("Wrong password!");
  }
}
</script>

</body>
</html>
